<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450">
  <defs>
    <!-- Metallic Gold Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3" />
      <stop offset="25%" stop-color="#CFA867" />
      <stop offset="50%" stop-color="#9C773D" />
      <stop offset="75%" stop-color="#FDF1BA" />
      <stop offset="100%" stop-color="#7A5624" />
    </linearGradient>

    <!-- Metallic Gold Highlight Gradient for Bridge -->
    <linearGradient id="goldBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5CE" />
      <stop offset="40%" stop-color="#D4AF6B" />
      <stop offset="70%" stop-color="#966F35" />
      <stop offset="100%" stop-color="#543A15" />
    </linearGradient>

    <!-- Ray-Ban Classic G-15 Green Semi-Transparent Lens Tint (Eyes visible through!) -->
    <linearGradient id="g15Lens" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142419" stop-opacity="0.52" />
      <stop offset="50%" stop-color="#1b3022" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#243d2c" stop-opacity="0.40" />
    </linearGradient>

    <!-- Realistic Glass Glint -->
    <linearGradient id="glassGlare" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="90%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.28" />
    </linearGradient>

    <filter id="frameShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.38" />
    </filter>
  </defs>

  <g id="aviator-frame" filter="url(#frameShadow)">
    <!-- 1. Silicone Nose Pads behind bridge -->
    <ellipse cx="445" cy="240" rx="8" ry="16" fill="#f2ede4" opacity="0.9" stroke="#9C773D" stroke-width="1.6" />
    <path d="M445,230 Q458,220 465,223" stroke="url(#goldRim)" stroke-width="3" fill="none" stroke-linecap="round" />

    <ellipse cx="555" cy="240" rx="8" ry="16" fill="#f2ede4" opacity="0.9" stroke="#9C773D" stroke-width="1.6" />
    <path d="M555,230 Q542,220 535,223" stroke="url(#goldRim)" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- 2. Left Teardrop Lens Glass (Semi-Transparent) -->
    <path id="left-lens"
      d="M 272,135 
         C 380,135 425,180 425,248 
         C 425,320 375,348 290,348 
         C 195,348 120,315 120,242 
         C 120,180 175,135 272,135 Z"
      fill="url(#g15Lens)" />
    <path
      d="M 272,135 
         C 380,135 425,180 425,248 
         C 425,320 375,348 290,348 
         C 195,348 120,315 120,242 
         C 120,180 175,135 272,135 Z"
      fill="url(#glassGlare)" />

    <!-- Left Metallic Wire Rim -->
    <path
      d="M 272,135 
         C 380,135 425,180 425,248 
         C 425,320 375,348 290,348 
         C 195,348 120,315 120,242 
         C 120,180 175,135 272,135 Z"
      fill="none" stroke="url(#goldRim)" stroke-width="5.5" stroke-linejoin="round" />
    <path
      d="M 272,135 
         C 380,135 425,180 425,248 
         C 425,320 375,348 290,348 
         C 195,348 120,315 120,242 
         C 120,180 175,135 272,135 Z"
      fill="none" stroke="#FFF7DB" stroke-width="1.2" opacity="0.75" />

    <!-- 3. Right Teardrop Lens Glass (Semi-Transparent) -->
    <path id="right-lens"
      d="M 728,135 
         C 620,135 575,180 575,248 
         C 575,320 625,348 710,348 
         C 805,348 880,315 880,242 
         C 880,180 825,135 728,135 Z"
      fill="url(#g15Lens)" />
    <path
      d="M 728,135 
         C 620,135 575,180 575,248 
         C 575,320 625,348 710,348 
         C 805,348 880,315 880,242 
         C 880,180 825,135 728,135 Z"
      fill="url(#glassGlare)" />

    <!-- Right Metallic Wire Rim -->
    <path
      d="M 728,135 
         C 620,135 575,180 575,248 
         C 575,320 625,348 710,348 
         C 805,348 880,315 880,242 
         C 880,180 825,135 728,135 Z"
      fill="none" stroke="url(#goldRim)" stroke-width="5.5" stroke-linejoin="round" />
    <path
      d="M 728,135 
         C 620,135 575,180 575,248 
         C 575,320 625,348 710,348 
         C 805,348 880,315 880,242 
         C 880,180 825,135 728,135 Z"
      fill="none" stroke="#FFF7DB" stroke-width="1.2" opacity="0.75" />

    <!-- 4. Top Sweat Bar (Signature Aviator Double Bridge) -->
    <path d="M 390,138 Q 500,128 610,138" stroke="url(#goldBar)" stroke-width="5" fill="none" stroke-linecap="round" />
    <path d="M 392,136 Q 500,126 608,136" stroke="#FFFFFF" stroke-width="1.2" fill="none" opacity="0.85" stroke-linecap="round" />

    <!-- Lower Nose Bridge -->
    <path d="M 425,180 Q 500,165 575,180" stroke="url(#goldRim)" stroke-width="4.5" fill="none" stroke-linecap="round" />
    <path d="M 427,178 Q 500,163 573,178" stroke="#FFFFFF" stroke-width="1.2" fill="none" opacity="0.8" stroke-linecap="round" />

    <!-- 5. 3D Outer Hinge Pieces -->
    <path d="M 120,205 L 68,202 L 68,212 L 120,212 Z" fill="url(#goldRim)" />
    <circle cx="116" cy="208" r="2.5" fill="#422c0f" />

    <path d="M 880,205 L 932,202 L 932,212 L 880,212 Z" fill="url(#goldRim)" />
    <circle cx="884" cy="208" r="2.5" fill="#422c0f" />
  </g>
</svg>
