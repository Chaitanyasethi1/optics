<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450">
  <defs>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE0D6" />
      <stop offset="35%" stop-color="#D99E8F" />
      <stop offset="70%" stop-color="#A86E60" />
      <stop offset="100%" stop-color="#F2C4B8" />
    </linearGradient>

    <!-- Clear Prescription Lens with Blue-Cut Anti-Reflective Reflex -->
    <linearGradient id="clearBlueCut" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#dff0fc" stop-opacity="0.22" />
      <stop offset="35%" stop-color="#c9e4fb" stop-opacity="0.12" />
      <stop offset="70%" stop-color="#d0dcf5" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#8bb4ec" stop-opacity="0.2" />
    </linearGradient>

    <!-- Diamond-Polished Beveled Rim Edge Glow -->
    <linearGradient id="bevelEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a6c8e8" stop-opacity="0.5" />
    </linearGradient>

    <filter id="rimlessShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <g id="rimless-frame" filter="url(#rimlessShadow)">
    <!-- Silicone Nose Pads -->
    <ellipse cx="440" cy="235" rx="8" ry="16" fill="#f0eae1" opacity="0.88" stroke="#A86E60" stroke-width="1.5" />
    <path d="M440,225 Q450,215 456,220" stroke="url(#roseGold)" stroke-width="3" fill="none" stroke-linecap="round" />

    <ellipse cx="560" cy="235" rx="8" ry="16" fill="#f0eae1" opacity="0.88" stroke="#A86E60" stroke-width="1.5" />
    <path d="M560,225 Q550,215 544,220" stroke="url(#roseGold)" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Left Floating Rimless Lens (Gentle Rectangle-Oval) -->
    <rect x="150" y="155" width="244" height="130" rx="45" ry="40" fill="url(#clearBlueCut)" />
    <!-- Diamond Polished Edge -->
    <rect x="150" y="155" width="244" height="130" rx="45" ry="40" fill="none" stroke="url(#bevelEdge)" stroke-width="2.5" />
    <rect x="152" y="157" width="240" height="126" rx="43" ry="38" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6" />

    <!-- Right Floating Rimless Lens -->
    <rect x="606" y="155" width="244" height="130" rx="45" ry="40" fill="url(#clearBlueCut)" />
    <!-- Diamond Polished Edge -->
    <rect x="606" y="155" width="244" height="130" rx="45" ry="40" fill="none" stroke="url(#bevelEdge)" stroke-width="2.5" />
    <rect x="608" y="157" width="240" height="126" rx="43" ry="38" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6" />

    <!-- Minimalist Screwless Bridge Arch -->
    <path d="M 394,208 Q 500,185 606,208" stroke="url(#roseGold)" stroke-width="4.5" fill="none" stroke-linecap="round" />
    <path d="M 396,207 Q 500,184 604,207" stroke="#FFFFFF" stroke-width="1" fill="none" opacity="0.8" />

    <!-- Left Bridge Pin Mount -->
    <circle cx="394" cy="208" r="4.5" fill="url(#roseGold)" />
    <circle cx="394" cy="208" r="1.5" fill="#5E382F" />

    <!-- Right Bridge Pin Mount -->
    <circle cx="606" cy="208" r="4.5" fill="url(#roseGold)" />
    <circle cx="606" cy="208" r="1.5" fill="#5E382F" />

    <!-- Left Hinge Mount Bracket -->
    <g id="left-mount">
      <circle cx="150" cy="208" r="4.5" fill="url(#roseGold)" />
      <circle cx="150" cy="208" r="1.5" fill="#5E382F" />
      <path d="M 150,208 L 125,205" stroke="url(#roseGold)" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Right Hinge Mount Bracket -->
    <g id="right-mount">
      <circle cx="850" cy="208" r="4.5" fill="url(#roseGold)" />
      <circle cx="850" cy="208" r="1.5" fill="#5E382F" />
      <path d="M 850,208 L 875,205" stroke="url(#roseGold)" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>
</svg>
