<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450">
  <defs>
    <linearGradient id="roundGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2C2" />
      <stop offset="30%" stop-color="#D4AF67" />
      <stop offset="60%" stop-color="#9C773D" />
      <stop offset="85%" stop-color="#FCEBA6" />
      <stop offset="100%" stop-color="#6E4C1D" />
    </linearGradient>

    <linearGradient id="amberLens" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b2413" stop-opacity="0.92" />
      <stop offset="50%" stop-color="#54351b" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#734a26" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="roundGlare" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3" />
    </linearGradient>

    <filter id="roundShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <g id="round-frame" filter="url(#roundShadow)">
    <!-- Silicone Nose Pads -->
    <ellipse cx="430" cy="235" rx="8" ry="16" fill="#e8e2d5" opacity="0.85" stroke="#9C773D" stroke-width="1.8" />
    <path d="M430,225 Q442,215 450,218" stroke="url(#roundGold)" stroke-width="3.5" fill="none" stroke-linecap="round" />

    <ellipse cx="570" cy="235" rx="8" ry="16" fill="#e8e2d5" opacity="0.85" stroke="#9C773D" stroke-width="1.8" />
    <path d="M570,225 Q558,215 550,218" stroke="url(#roundGold)" stroke-width="3.5" fill="none" stroke-linecap="round" />

    <!-- Left Circular Lens -->
    <circle cx="272" cy="220" r="120" fill="url(#amberLens)" />
    <circle cx="272" cy="220" r="120" fill="url(#roundGlare)" />

    <!-- Left Metallic Wire Rim -->
    <circle cx="272" cy="220" r="120" fill="none" stroke="url(#roundGold)" stroke-width="6.5" />
    <circle cx="272" cy="220" r="120" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.55" />

    <!-- Right Circular Lens -->
    <circle cx="728" cy="220" r="120" fill="url(#amberLens)" />
    <circle cx="728" cy="220" r="120" fill="url(#roundGlare)" />

    <!-- Right Metallic Wire Rim -->
    <circle cx="728" cy="220" r="120" fill="none" stroke="url(#roundGold)" stroke-width="6.5" />
    <circle cx="728" cy="220" r="120" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.55" />

    <!-- Arched Filigree Bridge -->
    <path d="M 390,210 Q 500,165 610,210" stroke="url(#roundGold)" stroke-width="6" fill="none" stroke-linecap="round" />
    <path d="M 392,208 Q 500,164 608,208" stroke="#FFFFFF" stroke-width="1.2" fill="none" opacity="0.7" />

    <!-- Hinge Barrels -->
    <g id="left-hinge">
      <rect x="135" y="212" width="18" height="12" rx="2" fill="url(#roundGold)" stroke="#6E4C1D" stroke-width="1.2" />
      <circle cx="144" cy="218" r="2.5" fill="#523814" />
      <path d="M 135,215 L 115,212 L 115,220 L 135,220 Z" fill="url(#roundGold)" />
    </g>

    <g id="right-hinge">
      <rect x="847" y="212" width="18" height="12" rx="2" fill="url(#roundGold)" stroke="#6E4C1D" stroke-width="1.2" />
      <circle cx="856" cy="218" r="2.5" fill="#523814" />
      <path d="M 865,215 L 885,212 L 885,220 L 865,220 Z" fill="url(#roundGold)" />
    </g>
  </g>
</svg>
