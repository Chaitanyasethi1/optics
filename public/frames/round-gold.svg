<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450">
  <defs>
    <!-- Ultra-Luxe Polished Champagne Gold Gradient -->
    <linearGradient id="roundGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5CE" />
      <stop offset="20%" stop-color="#D4AF67" />
      <stop offset="50%" stop-color="#9C773D" />
      <stop offset="80%" stop-color="#FCEBA6" />
      <stop offset="100%" stop-color="#7A5624" />
    </linearGradient>

    <!-- Beveled Edge Specular Highlight -->
    <linearGradient id="bevelGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#D4AF67" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#6E4C1D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4" />
    </linearGradient>

    <!-- Clear Prescription / Blue-Cut Optical Glass: Transparent so the user's eyes & pupils are 100% visible! -->
    <linearGradient id="opticalClearLens" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#E2F0FD" stop-opacity="0.12" />
      <stop offset="40%" stop-color="#CDE4FA" stop-opacity="0.05" />
      <stop offset="75%" stop-color="#D6E8FC" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#8BB8EB" stop-opacity="0.16" />
    </linearGradient>

    <!-- Diagonal Anti-Reflective (AR) Coating Glare -->
    <linearGradient id="arGlare" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="22%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="38%" stop-color="#72D2FF" stop-opacity="0.0" />
      <stop offset="70%" stop-color="#997AFF" stop-opacity="0.0" />
      <stop offset="88%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.28" />
    </linearGradient>

    <!-- Soft Ambient Frame Shadow on Skin -->
    <filter id="roundShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g id="round-frame" filter="url(#roundShadow)">
    <!-- 1. Silicone Nose Pads with Gold Stems -->
    <ellipse cx="430" cy="225" rx="7" ry="15" fill="#f4efe6" opacity="0.9" stroke="#9C773D" stroke-width="1.4" />
    <path d="M430,216 Q442,206 450,210" stroke="url(#roundGold)" stroke-width="2.8" fill="none" stroke-linecap="round" />

    <ellipse cx="570" cy="225" rx="7" ry="15" fill="#f4efe6" opacity="0.9" stroke="#9C773D" stroke-width="1.4" />
    <path d="M570,216 Q558,206 550,210" stroke="url(#roundGold)" stroke-width="2.8" fill="none" stroke-linecap="round" />

    <!-- 2. Left Optical Circular Lens (Clear transparent glass) -->
    <circle cx="272" cy="225" r="128" fill="url(#opticalClearLens)" />
    <circle cx="272" cy="225" r="128" fill="url(#arGlare)" />

    <!-- Left Metallic Wire Rim with Luxury Chamfer -->
    <circle cx="272" cy="225" r="128" fill="none" stroke="url(#roundGold)" stroke-width="5" />
    <circle cx="272" cy="225" r="126.5" fill="none" stroke="url(#bevelGold)" stroke-width="1.2" opacity="0.8" />
    <circle cx="272" cy="225" r="129.5" fill="none" stroke="#523814" stroke-width="0.8" opacity="0.4" />

    <!-- 3. Right Optical Circular Lens (Clear transparent glass) -->
    <circle cx="728" cy="225" r="128" fill="url(#opticalClearLens)" />
    <circle cx="728" cy="225" r="128" fill="url(#arGlare)" />

    <!-- Right Metallic Wire Rim with Luxury Chamfer -->
    <circle cx="728" cy="225" r="128" fill="none" stroke="url(#roundGold)" stroke-width="5" />
    <circle cx="728" cy="225" r="126.5" fill="none" stroke="url(#bevelGold)" stroke-width="1.2" opacity="0.8" />
    <circle cx="728" cy="225" r="129.5" fill="none" stroke="#523814" stroke-width="0.8" opacity="0.4" />

    <!-- 4. Sculpted Filigree Nose Bridge -->
    <path d="M 398,212 Q 500,172 602,212" stroke="url(#roundGold)" stroke-width="5" fill="none" stroke-linecap="round" />
    <path d="M 400,210 Q 500,170 600,210" stroke="#FFFFFF" stroke-width="1.2" fill="none" opacity="0.85" stroke-linecap="round" />

    <!-- 5. 3D Outer Hinge Barrels & Rivet Joints (extends to edges of face) -->
    <g id="left-hinge">
      <path d="M 144,220 L 72,218 L 72,228 L 144,228 Z" fill="url(#roundGold)" />
      <rect x="130" y="217" width="16" height="12" rx="2" fill="url(#roundGold)" stroke="#6E4C1D" stroke-width="1.2" />
      <circle cx="138" cy="223" r="2.2" fill="#422c0f" />
    </g>

    <g id="right-hinge">
      <path d="M 856,220 L 928,218 L 928,228 L 856,228 Z" fill="url(#roundGold)" />
      <rect x="854" y="217" width="16" height="12" rx="2" fill="url(#roundGold)" stroke="#6E4C1D" stroke-width="1.2" />
      <circle cx="862" cy="223" r="2.2" fill="#422c0f" />
    </g>
  </g>
</svg>
