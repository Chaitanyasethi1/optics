<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450">
  <defs>
    <!-- Deep Glossy Acetate Gradient -->
    <linearGradient id="acetateBlack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c2b2a" />
      <stop offset="20%" stop-color="#141414" />
      <stop offset="70%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#1c1b1a" />
    </linearGradient>

    <!-- Chrome Rivet Studs Gradient -->
    <linearGradient id="chromeStud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0e0e0" />
      <stop offset="70%" stop-color="#999999" />
      <stop offset="100%" stop-color="#555555" />
    </linearGradient>

    <!-- Semi-Transparent Dark Smoke Lens Tint (Eyes visible through!) -->
    <linearGradient id="wayfarerLens" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101a14" stop-opacity="0.52" />
      <stop offset="60%" stop-color="#19261f" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#1f3027" stop-opacity="0.40" />
    </linearGradient>

    <!-- Studio Softbox Glare -->
    <linearGradient id="wayfarerGlare" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.40" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25" />
    </linearGradient>

    <filter id="wayfarerShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <g id="wayfarer-frame" filter="url(#wayfarerShadow)">
    <!-- 1. Left Lens Cutout -->
    <path id="left-lens"
      d="M 175,138
         L 375,148
         C 388,149 395,160 392,175
         L 368,285
         C 362,315 340,325 305,325
         L 230,325
         C 185,325 158,300 152,260
         L 142,168
         C 140,148 152,137 175,138 Z"
      fill="url(#wayfarerLens)" />
    <path
      d="M 175,138
         L 375,148
         C 388,149 395,160 392,175
         L 368,285
         C 362,315 340,325 305,325
         L 230,325
         C 185,325 158,300 152,260
         L 142,168
         C 140,148 152,137 175,138 Z"
      fill="url(#wayfarerGlare)" />

    <!-- 2. Right Lens Cutout -->
    <path id="right-lens"
      d="M 825,138
         L 625,148
         C 612,149 605,160 608,175
         L 632,285
         C 638,315 660,325 695,325
         L 770,325
         C 815,325 842,300 848,260
         L 858,168
         C 860,148 848,137 825,138 Z"
      fill="url(#wayfarerLens)" />
    <path
      d="M 825,138
         L 625,148
         C 612,149 605,160 608,175
         L 632,285
         C 638,315 660,325 695,325
         L 770,325
         C 815,325 842,300 848,260
         L 858,168
         C 860,148 848,137 825,138 Z"
      fill="url(#wayfarerGlare)" />

    <!-- 3. Outer Bold Acetate Frame Body -->
    <path
      d="M 68,132
         C 62,112 85,102 118,105
         L 440,116
         C 465,117 475,135 480,155
         C 485,175 490,185 500,185
         C 510,185 515,175 520,155
         C 525,135 535,117 560,116
         L 882,105
         C 915,102 938,112 932,132
         L 915,215
         C 908,245 885,325 845,340
         L 675,340
         C 645,340 622,320 618,290
         L 592,185
         C 590,175 580,165 570,165
         C 555,165 540,180 535,210
         L 530,240
         C 525,260 515,270 500,270
         C 485,270 475,260 470,240
         L 465,210
         C 460,180 445,165 430,165
         C 420,165 410,175 408,185
         L 382,290
         C 378,320 355,340 325,340
         L 155,340
         C 115,325 92,245 85,215
         L 68,132 Z
         M 175,138
         L 375,148
         C 388,149 395,160 392,175
         L 368,285
         C 362,315 340,325 305,325
         L 230,325
         C 185,325 158,300 152,260
         L 142,168
         C 140,148 152,137 175,138 Z
         M 825,138
         L 625,148
         C 612,149 605,160 608,175
         L 632,285
         C 638,315 660,325 695,325
         L 770,325
         C 815,325 842,300 848,260
         L 858,168
         C 860,148 848,137 825,138 Z"
      fill="url(#acetateBlack)"
      fill-rule="evenodd"
      stroke="#141414"
      stroke-width="1.5" />

    <!-- Top Browline Chamfer Highlight -->
    <path d="M 100,108 L 440,119" stroke="#ffffff" stroke-width="2.5" opacity="0.35" stroke-linecap="round" />
    <path d="M 900,108 L 560,119" stroke="#ffffff" stroke-width="2.5" opacity="0.35" stroke-linecap="round" />

    <!-- Iconic Horizontal Chrome Oval Stud Rivets -->
    <g id="left-stud">
      <ellipse cx="98" cy="132" rx="7" ry="3.5" fill="url(#chromeStud)" transform="rotate(-6 98 132)" />
    </g>
    <g id="right-stud">
      <ellipse cx="902" cy="132" rx="7" ry="3.5" fill="url(#chromeStud)" transform="rotate(6 902 132)" />
    </g>
  </g>
</svg>
